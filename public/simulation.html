<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelourCare 3D Aligner Simulation</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <!-- Remixicon & Fonts -->
    <link rel="stylesheet" href="/assets/index-G8lhJxba.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="/assets/vc-simulation.js" defer></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111420;
            font-family: 'HK Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e9ecef;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Top Navigation Header */
        .viewer-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(17, 20, 32, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .viewer-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .viewer-brand img {
            height: 32px;
            width: 32px;
            object-fit: contain;
        }
        .viewer-brand-title {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .viewer-case-badge {
            background: rgba(10, 179, 156, 0.2);
            color: #0ab39c;
            border: 1px solid rgba(10, 179, 156, 0.4);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
        }
        .patient-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #a0aec0;
        }
        .patient-meta strong {
            color: #fff;
        }
        /* Floating Control Bar */
        .viewer-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 27, 46, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }
        .ctrl-btn:hover {
            background: #0ab39c;
            border-color: #0ab39c;
            color: #fff;
            transform: scale(1.05);
        }
        .ctrl-btn.active {
            background: #405189;
            border-color: #405189;
        }
        .timeline-slider-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 280px;
        }
        .timeline-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            outline: none;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0ab39c;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(10, 179, 156, 0.8);
        }
        .stage-indicator {
            font-size: 12px;
            font-weight: 700;
            color: #0ab39c;
            min-width: 85px;
            text-align: center;
        }
        /* Right Side Diagnostic Panel */
        .side-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 10;
            width: 300px;
            background: rgba(22, 27, 46, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .side-panel h6 {
            margin: 0 0 12px 0;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #0ab39c;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ipr-mini-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
        }
        .ipr-mini-row:last-child {
            border-bottom: none;
        }
        .ipr-badge-mini {
            background: rgba(240, 101, 72, 0.2);
            color: #f06548;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .ipr-timing-mini {
            color: #f7b84b;
            font-size: 11px;
        }
        /* View Preset Buttons */
        .view-presets {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .preset-btn {
            background: rgba(22, 27, 46, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .preset-btn:hover, .preset-btn.active {
            background: #0ab39c;
            color: #fff;
            border-color: #0ab39c;
        }
    </style>
</head>
<body>
    <div class="viewer-header">
        <div class="viewer-brand">
            <img src="/assets/vc-connect-square-v2.png" alt="VelourCare Logo">
            <span class="viewer-brand-title">VelourCare Ortho</span>
            <span class="viewer-case-badge" id="viewer-setup-badge">3D Digital Setup</span>
        </div>
        <div class="patient-meta">
            <span>Patient: <strong id="meta-patient">Loading...</strong></span>
            <span>Case ID: <strong id="meta-case-id">—</strong></span>
            <span>Doctor: <strong id="meta-doctor">—</strong></span>
            <span>Prescription: <strong id="meta-prescription">—</strong></span>
        </div>
        <div>
            <a id="back-to-case-link" href="/cases" style="color:#0ab39c;text-decoration:none;font-size:13px;font-weight:600;">
                <i class="ri-arrow-left-line"></i> Back to Case
            </a>
        </div>
    </div>

    <!-- View Preset Angles -->
    <div class="view-presets">
        <button class="preset-btn active" data-view="front" type="button">Frontal Bite</button>
        <button class="preset-btn" data-view="upper" type="button">Upper Occlusal</button>
        <button class="preset-btn" data-view="lower" type="button">Lower Occlusal</button>
        <button class="preset-btn" data-view="right" type="button">Right Buccal</button>
        <button class="preset-btn" data-view="left" type="button">Left Buccal</button>
        <button class="preset-btn" id="toggleAlignerBtn" type="button"><i class="ri-shield-check-line"></i> Toggle Aligner</button>
    </div>

    <!-- Right Side Diagnostic Panel -->
    <div class="side-panel">
        <h6>
            <span>IPR Reduction Staging</span>
            <span class="badge bg-primary-subtle text-primary" id="ipr-total-badge" style="font-size:11px;">0.00mm Total</span>
        </h6>
        <div id="ipr-rows-container">
            <div class="ipr-mini-row">Loading clinical protocol...</div>
        </div>

        <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:#a0aec0;">
            <i class="ri-information-line text-info"></i> Wear schedule: 10 days per stage.<br>
            Perform IPR before inserting indicated stage.
        </div>
    </div>

    <!-- Floating Playback Bar -->
    <div class="viewer-controls">
        <button class="ctrl-btn" id="playBtn" type="button" title="Play / Pause Animation">
            <span id="playIcon">▶</span>
        </button>
        <button class="ctrl-btn" id="prevStepBtn" type="button" title="Previous Stage">◀</button>
        <div class="timeline-slider-wrap">
            <input type="range" min="1" max="22" value="1" class="timeline-slider" id="stageSlider">
            <span class="stage-indicator" id="stageLabel">Stage 01 / 22</span>
        </div>
        <button class="ctrl-btn" id="nextStepBtn" type="button" title="Next Stage">▶</button>
        <button class="ctrl-btn" id="resetRotationBtn" type="button" title="Reset Camera">↺</button>
    </div>

    <div id="webgl-container"></div>
</body>
</html>
